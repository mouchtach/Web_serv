<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 Not Found — webserv</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="error-page">
  <div class="error-card">
    <div class="error-icon">?</div>
    <div class="error-code warn">404</div>
    <div class="error-status">Not Found</div>
    <div class="error-msg">
      <div class="prompt-line"><span>$</span> webserv --resolve-target</div>
      The resource you're looking for doesn't exist on this server, or the
      path was mistyped. Nothing was found at the requested URI.
    </div>
    <div class="error-actions">
      <a href="/">← Back to home</a>
    </div>
  </div>
</div>
</body>
</html>
