<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>413 Payload Too Large — webserv</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="error-page">
  <div class="error-card">
    <div class="error-icon">↑</div>
    <div class="error-code warn">413</div>
    <div class="error-status">Payload Too Large</div>
    <div class="error-msg">
      <div class="prompt-line"><span>$</span> webserv --check-body-size</div>
      The uploaded file or request body exceeds this server's
      <code>client_max_body_size</code> limit. Try a smaller file.
    </div>
    <div class="error-actions">
      <a href="/">← Back to home</a>
    </div>
  </div>
</div>
</body>
</html>
