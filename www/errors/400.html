<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>400 Bad Request — webserv</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="error-page">
  <div class="error-card">
    <div class="error-icon">!</div>
    <div class="error-code warn">400</div>
    <div class="error-status">Bad Request</div>
    <div class="error-msg">
      <div class="prompt-line"><span>$</span> webserv --parse-request</div>
      The server could not understand the request due to malformed syntax.
      Check the request method, headers, and body, then try again.
    </div>
    <div class="error-actions">
      <a href="/">← Back to home</a>
    </div>
  </div>
</div>
</body>
</html>
